name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore pkgdec.sln

      - name: Build
        run: dotnet build pkgdec.sln --configuration Release --no-restore

      - name: Publish
        run: >
          dotnet publish pkgdec/pkgdec.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkgdec5-win-x64
          path: publish/
